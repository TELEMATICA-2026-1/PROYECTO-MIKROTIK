{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroCore - Iniciar Sesión</title>

    <!-- Enlazamos el CSS de Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet" href="{% static 'css/login.css' %}?">
    
</head>

<body>
    <!-- Contenedor principal centrado vertical y horizontalmente -->
    <div class="container-fluid d-flex justify-content-center align-items-center">
       <div class="login-card text-center">
            <!-- Seccion del logo -->
             <div class="d-flex align-items-center justify-content-center">
                <img src="{% static 'images/LogoLogin.svg' %}" alt="Logo" width="410" height="100" >
             </div>
             <!-- Formulario de inicio de sesion --> 
             {% if user.is_authenticated %}
                <div class="login-btn container">
                    <h2 class="login-title text-white text-start fw-bold">Ya has iniciado sesión</h2>
                    <div class="login-btn-container">
                        <a href="{% url 'signout' %}" class="btn btn-custom btn-bg-cerrar-sesion">Cerrar sesión</a>
                        <a href="{% url 'home' %}" class="btn btn-primary btn-custom btn-bg-continuar">Continuar</a>
                    </div>
                   
                </div>
             {% else %}
                <!-- Titulo del login --> 
                <h2 class="login-title text-white mb-4 text-start fw-bold">Iniciar Sesión</h2>
                {% if error %}
                <!-- Contenedor del toast para mostrar el error -->
                <div class="toast-container-custom">
                    <!-- Mensaje de credenciales incorrectas -->
                    <div id="loginToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-login-error="true">
                        <!-- Título y botón de cierre -->
                        <div class="toast-header ">
                            <img src="{% static 'images/error.svg' %}" alt="Error" class="toast-icon me-2">
                            <strong class="me-auto toast-title">Error de acceso</strong>
                            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
                        </div>   
                        <!-- Mensaje de error -->
                        <div class="toast-body">
                            {{ error }}
                        </div>
                    </div>
                </div>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <!-- Nombre del usuario--> 
                    <div class="mb-3">
                        {{form.username}}
                    </div>
                    <!-- Contraseña del usuario--> 
                    <div class="mb-4">
                        {{form.password}}
                    </div>
                    <!-- Boton de inicio de sesion--> 
                    <div class="login-btn-container mt-3">
                        <button type="submit" class="btn btn-primary btn-custom btn-bg-continuar">Iniciar sesion</button>
                    </div>
                </div>
                <!-- Si las credenciales estan incorrectas--> 

            </form>
            {% endif %}
       </div>
        
     </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
